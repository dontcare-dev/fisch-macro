name: Build Fish Macro
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "requirements.txt"
      - "build.bat"
      - ".github/workflows/build-windows.yml"
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build optimized executable
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name "Fish Macro"
          --exclude-module tkinter
          --exclude-module unittest
          --exclude-module test
          --exclude-module pytest
          --exclude-module matplotlib
          --exclude-module scipy
          --exclude-module PySide6.QtWebEngineCore
          --exclude-module PySide6.QtWebEngineWidgets
          --exclude-module PySide6.QtQml
          --exclude-module PySide6.QtQuick
          --exclude-module PySide6.Qt3DCore
          --exclude-module PySide6.Qt3DRender
          --exclude-module PySide6.Qt3DWidgets
          --exclude-module PySide6.QtMultimedia
          --exclude-module PySide6.QtCharts
          --exclude-module PySide6.QtDataVisualization
          --exclude-module PySide6.QtPdf
          --exclude-module PySide6.QtDesigner
          --exclude-module PySide6.QtHelp
          --exclude-module PySide6.QtSql
          --exclude-module PySide6.QtSvg
          --exclude-module PySide6.QtTest
          main.py
      - name: Report executable size
        shell: pwsh
        run: |
          $file = Get-Item "dist/Fish Macro.exe"
          Write-Host "Executable size: $([math]::Round($file.Length / 1MB, 2)) MB"
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Fish-Macro-Windows
          path: "dist/Fish Macro.exe"
