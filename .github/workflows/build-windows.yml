name: Build Fish Macro
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "main.py"
      - "requirements.txt"
      - ".github/workflows/build-windows.yml"
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build executable
        run: pyinstaller --noconfirm --clean --onefile --windowed --name "Fish Macro" --collect-all cv2 --collect-all PySide6 main.py
      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Fish-Macro-Windows
          path: "dist/Fish Macro.exe"
